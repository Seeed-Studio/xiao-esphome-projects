name: XIAO ESP32-C5 OpenThread RCP

on:
  push:
    paths:
      - 'projects/xiao-esp32-c5-openthread-rcp/**'
      - '.github/workflows/ci-openthread-rcp.yml'
  pull_request:
    paths:
      - 'projects/xiao-esp32-c5-openthread-rcp/**'
      - '.github/workflows/ci-openthread-rcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    container: espressif/idf:v5.5.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build and check USB RCP
        run: |
          . $IDF_PATH/export.sh
          cd projects/xiao-esp32-c5-openthread-rcp
          idf.py set-target esp32c5
          idf.py build
          python tools/check_build.py build
